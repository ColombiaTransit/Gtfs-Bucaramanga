name: Probe SITME future schedules
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check future-date schedule fields
        run: python scripts/probe_sitme_schedules.py
      - name: Upload schedule probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitme-future-schedule-probe
          path: data/sitme/schedule-probe-2026-11/
          if-no-files-found: warn
          retention-days: 30
